<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1d2e;stop-opacity:1" />
    </linearGradient>
    <!-- Icon glow gradient -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0" />
    </radialGradient>
    <!-- Purple-to-cyan gradient for the icon shape -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7" />
      <stop offset="50%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#06b6d4" />
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0" />
      <stop offset="100%" style="stop-color:#cbd5e1" />
    </linearGradient>
    <!-- Accent gradient for "Crew" -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7" />
      <stop offset="100%" style="stop-color:#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect width="520" height="140" rx="16" fill="url(#bgGrad)" />
  <!-- Subtle border -->
  <rect width="520" height="140" rx="16" fill="none" stroke="#2d2f45" stroke-width="1.5" />

  <!-- ── Icon area (left 130px) ── -->
  <!-- Outer glow halo -->
  <circle cx="70" cy="70" r="46" fill="url(#nodeGlow)" opacity="0.8" />

  <!-- Hexagon background plate -->
  <polygon points="70,28 106,49 106,91 70,112 34,91 34,49"
           fill="#1e1b2e" stroke="#2d2f45" stroke-width="1.5" />

  <!-- Neural network edges (drawn before nodes) -->
  <!-- Layer 1 → Layer 2 connections -->
  <line x1="48" y1="55" x2="70" y2="55" stroke="#4f46e5" stroke-width="1" opacity="0.5" />
  <line x1="48" y1="55" x2="70" y2="70" stroke="#4f46e5" stroke-width="1" opacity="0.5" />
  <line x1="48" y1="70" x2="70" y2="55" stroke="#4f46e5" stroke-width="1" opacity="0.5" />
  <line x1="48" y1="70" x2="70" y2="70" stroke="#4f46e5" stroke-width="1" opacity="0.5" />
  <line x1="48" y1="70" x2="70" y2="85" stroke="#4f46e5" stroke-width="1" opacity="0.5" />
  <line x1="48" y1="85" x2="70" y2="70" stroke="#4f46e5" stroke-width="1" opacity="0.5" />
  <line x1="48" y1="85" x2="70" y2="85" stroke="#4f46e5" stroke-width="1" opacity="0.5" />
  <!-- Layer 2 → Layer 3 connections -->
  <line x1="70" y1="55" x2="92" y2="62" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="55" x2="92" y2="78" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="70" x2="92" y2="62" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="70" x2="92" y2="78" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="85" x2="92" y2="62" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="85" x2="92" y2="78" stroke="#06b6d4" stroke-width="1" opacity="0.5" />

  <!-- Layer 1 nodes (input) -->
  <circle cx="48" cy="55" r="5" fill="#a855f7" filter="url(#glow)" />
  <circle cx="48" cy="70" r="5" fill="#a855f7" filter="url(#glow)" />
  <circle cx="48" cy="85" r="5" fill="#a855f7" filter="url(#glow)" />

  <!-- Layer 2 nodes (hidden) -->
  <circle cx="70" cy="55" r="5.5" fill="#6366f1" filter="url(#glow)" />
  <circle cx="70" cy="70" r="5.5" fill="#6366f1" filter="url(#glow)" />
  <circle cx="70" cy="85" r="5.5" fill="#6366f1" filter="url(#glow)" />

  <!-- Layer 3 nodes (output) — slightly larger, brightest -->
  <circle cx="92" cy="62" r="6" fill="#06b6d4" filter="url(#softGlow)" />
  <circle cx="92" cy="78" r="6" fill="#06b6d4" filter="url(#softGlow)" />

  <!-- Small molecule/atom orbits overlaid on top-right of hex -->
  <circle cx="98" cy="42" r="9" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.6" stroke-dasharray="3 2" />
  <circle cx="98" cy="42" r="3" fill="#a855f7" opacity="0.9" />
  <circle cx="107" cy="38" r="2" fill="#e879f9" opacity="0.8" />

  <!-- ── Text area ── -->
  <!-- "Research" -->
  <text x="138" y="72"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-0.5"
        fill="url(#textGrad)">Research</text>

  <!-- "Crew" with gradient accent -->
  <text x="138" y="108"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="800" letter-spacing="-0.5"
        fill="url(#accentGrad)" filter="url(#glow)">Crew</text>

  <!-- Tagline -->
  <text x="140" y="125"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="400" letter-spacing="0.5"
        fill="#64748b">AI-powered multi-agent scientific research library</text>

  <!-- Version badge -->
  <rect x="388" y="108" width="104" height="20" rx="10"
        fill="#1e1b2e" stroke="#2d2f45" stroke-width="1" />
  <text x="440" y="122"
        font-family="'Segoe UI', 'Inter', monospace, sans-serif"
        font-size="10" font-weight="600" letter-spacing="0.3"
        text-anchor="middle" fill="#6366f1">v0.1.0 · alpha</text>

  <!-- Subtle grid dots in background -->
  <g opacity="0.06" fill="#e2e8f0">
    <circle cx="160" cy="20" r="1.5"/><circle cx="200" cy="20" r="1.5"/>
    <circle cx="240" cy="20" r="1.5"/><circle cx="280" cy="20" r="1.5"/>
    <circle cx="320" cy="20" r="1.5"/><circle cx="360" cy="20" r="1.5"/>
    <circle cx="400" cy="20" r="1.5"/><circle cx="440" cy="20" r="1.5"/>
    <circle cx="480" cy="20" r="1.5"/>
    <circle cx="480" cy="60" r="1.5"/><circle cx="480" cy="100" r="1.5"/>
    <circle cx="160" cy="130" r="1.5"/><circle cx="200" cy="130" r="1.5"/>
    <circle cx="240" cy="130" r="1.5"/>
  </g>
</svg>
